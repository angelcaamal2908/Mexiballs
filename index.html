<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="metaThemeColor" content="#FAF5EC">
  <link rel="icon" type="image/png" href="imagenes/logo.png">
  <meta name="description" content="MEXIBALLS: botanas esféricas artesanales con sabores de México y Yucatán. Tizimín, Yucatán.">
  <title>MEXIBALLS | El corazón de Yucatán en cada bocado</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <style>
    :root {
      --bg: #FAF5EC;
      --surface: #FFFDF9;
      --surface-alt: #F2E8D9;
      --surface-warm: #EAE0CF;
      --primary: #B83B1E;
      --primary-dark: #932D15;
      --secondary: #1C4E38;
      --accent: #C88A1E;
      --ink: #1F1A16;
      --muted: #675C52;
      --border: #E2D5C3;
      --radius: 6px;
      --transition: 0.28s ease;
    }

    /* Paletas por temporada */
    body[data-season="navidad"] {
      --bg: #F8F4EE;
      --surface: #FFFDFB;
      --surface-alt: #ECE4D8;
      --surface-warm: #E2D6C5;
      --primary: #9B2226;
      --primary-dark: #78191C;
      --secondary: #1B4332;
      --accent: #B6862C;
      --ink: #1C1917;
      --border: #DFD3C3;
    }

    body[data-season="newyear"] {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --surface-alt: #ECE8DF;
      --surface-warm: #E0DACD;
      --primary: #1E2D3D;
      --primary-dark: #131D28;
      --secondary: #7C5832;
      --accent: #C0952B;
      --ink: #171A1D;
      --border: #DDD6C9;
    }

    body[data-season="sanvalentin"] {
      --bg: #FCF4F3;
      --surface: #FFFDFD;
      --surface-alt: #F5E5E3;
      --surface-warm: #EAD3D0;
      --primary: #A62C43;
      --primary-dark: #821F32;
      --secondary: #4B2434;
      --accent: #C97363;
      --ink: #23171B;
      --border: #E6D1CE;
    }

    body[data-season="verano"] {
      --bg: #FBF7EE;
      --surface: #FFFDF8;
      --surface-alt: #F2E9D5;
      --surface-warm: #E6D9BE;
      --primary: #C45519;
      --primary-dark: #9C4110;
      --secondary: #165B61;
      --accent: #D69718;
      --ink: #1E1B16;
      --border: #E4D7C0;
    }

    body[data-season="halloween"] {
      --bg: #F8F2EA;
      --surface: #FFFBF6;
      --surface-alt: #EFE2D2;
      --surface-warm: #E3D1BC;
      --primary: #B64914;
      --primary-dark: #8F370D;
      --secondary: #3C2238;
      --accent: #D48119;
      --ink: #1F1814;
      --border: #E2D2BF;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      transition: background-color var(--transition), color var(--transition);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }

    .display {
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: -0.025em;
      font-weight: 500;
    }

    .script {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* Cenefa artesanal superior */
    .craft-border {
      height: 5px;
      background: repeating-linear-gradient(
        90deg,
        var(--primary) 0 24px,
        var(--accent) 24px 36px,
        var(--secondary) 36px 60px,
        var(--bg) 60px 68px
      );
      transition: background var(--transition);
    }

    /* Barra superior de temporada + selector funcional */
    .utility-bar {
      background: var(--secondary);
      color: #FBF7F0;
      font-size: 0.78rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      transition: background-color var(--transition);
    }

    .utility-inner {
      min-height: 40px;
      padding: 6px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .season-status {
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.72rem;
    }

    .season-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex: none;
    }

    .season-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .season-switcher label {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.03em;
    }

    .season-switcher select {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .season-switcher select option {
      background: #1F1A16;
      color: #FFFFFF;
    }

    /* Navegación */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 253, 249, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 54px;
      height: 48px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .brand-word {
      font-family: Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--primary);
      font-size: 1.08rem;
      transition: color var(--transition);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink);
    }

    .nav-links a {
      position: relative;
      padding: 4px 0;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--primary); }

    .btn {
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 12px 22px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }
    .btn-primary:hover { background: var(--primary-dark); }

    .btn-secondary {
      background: var(--secondary);
      color: #FFFFFF;
    }

    .btn-outline {
      border-color: var(--ink);
      color: var(--ink);
      background: transparent;
    }
    .btn-outline:hover {
      background: var(--ink);
      color: var(--surface);
    }

    .btn-small {
      padding: 8px 15px;
      font-size: 0.82rem;
    }

    .mobile-menu {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      color: var(--ink);
      font-size: 1.35rem;
    }

    /* Hero Editorial */
    .hero {
      padding: 44px 0 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      transition: background-color var(--transition);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 48px;
      align-items: center;
    }

    .season-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 4px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--secondary);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .season-pill span { color: var(--primary); }

    .eyebrow {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: clamp(2.9rem, 5.6vw, 4.9rem);
      line-height: 0.98;
      margin: 0 0 16px;
      color: var(--ink);
    }

    .hero h1 span {
      color: var(--primary);
      font-style: italic;
    }

    .tagline {
      font-size: clamp(1.25rem, 2.2vw, 1.65rem);
      color: var(--secondary);
      margin: 0 0 14px;
    }

    .hero-copy {
      max-width: 500px;
      color: var(--muted);
      font-size: 1rem;
      margin: 0 0 22px;
    }

    .offer-strip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--surface-alt);
      border-left: 3px solid var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-media {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-frame {
      position: relative;
      width: fit-content;
      max-width: 100%;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .hero-frame:has(img[style*="display: none"]) {
      display: none;
    }

    .hero-frame img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 430px;
      object-fit: contain;
    }

    .hero-stamp {
      position: absolute;
      right: -12px;
      bottom: -14px;
      z-index: 4;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--primary);
      color: #FFFDF9;
      border: 2px solid var(--surface);
      display: grid;
      place-items: center;
      text-align: center;
      font-family: Georgia, serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.25;
      transform: rotate(-7deg);
      transition: background-color var(--transition);
    }

    /* Índice rápido de menú — Tipografía grande y bien distribuida */
    .menu-index {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 46px 0;
    }

    .index-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
    }

    .index-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 3.2vw, 2.45rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--primary);
      line-height: 1.1;
    }

    .index-head a {
      color: var(--secondary);
      font-size: 1.05rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s, transform 0.2s;
    }

    .index-head a:hover {
      color: var(--primary);
      transform: translateX(2px);
    }

    .index-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .index-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 24px 20px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      transition: border-color 0.2s, background-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .index-item:hover {
      border-color: var(--primary);
      background: var(--surface);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(31, 26, 22, 0.06);
    }

    .index-item b {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 1.65rem;
      line-height: 1.15;
      color: var(--ink);
    }

    .index-item span {
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--muted);
    }

    /* Banda de promoción */
    .promo-band {
      background: var(--secondary);
      color: #FFFDF9;
      padding: 36px 0;
      transition: background-color var(--transition);
    }

    .promo-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .promo-kicker {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #E7C687;
      text-transform: uppercase;
    }

    .promo-inner h2 {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.9rem, 3.8vw, 2.9rem);
      line-height: 1.04;
      margin: 8px 0;
    }

    .promo-inner h2 em { color: #F0C97D; }

    .promo-inner p {
      margin: 0;
      color: rgba(255, 253, 249, 0.84);
      font-size: 0.95rem;
    }

    .promo-seal {
      width: 108px;
      height: 108px;
      flex: none;
      border: 1.5px solid #E7C687;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(-6deg);
      color: #F3D79C;
    }

    .promo-seal strong {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 2.3rem;
      line-height: 1;
    }

    .promo-seal span {
      text-align: center;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.2;
    }

    /* Secciones generales */
    .section { padding: 72px 0; }

    .section-head {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 38px;
    }

    .section-kicker {
      display: block;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .section h2 {
      font-size: clamp(2.1rem, 4.4vw, 3.1rem);
      line-height: 1.06;
      color: var(--ink);
      margin: 0 0 12px;
    }

    .section-head p {
      color: var(--muted);
      margin: 0;
    }

    /* Historia */
    .about {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 44px;
      align-items: center;
    }

    .about-card {
      background: var(--primary);
      color: #FFFDF9;
      padding: 36px 32px;
      border-radius: var(--radius);
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color var(--transition);
    }

    .about-card strong {
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: 2.35rem;
      line-height: 1.08;
    }

    .about-card span {
      color: rgba(255, 253, 249, 0.85);
      font-size: 0.92rem;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      padding-top: 14px;
      margin-top: 24px;
    }

    .about-text p {
      color: var(--muted);
      margin: 0 0 14px;
    }

    .about-attributes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .attr-item strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .attr-item small {
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* Menú */
    .menu-section { background: var(--surface); }

    .menu-search {
      margin: 22px auto 0;
      max-width: 390px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 10px 14px;
      border-radius: var(--radius);
    }

    .menu-search input {
      border: 0;
      background: transparent;
      outline: none;
      flex: 1;
      min-width: 0;
      color: var(--ink);
      font-size: 0.9rem;
    }

    .flavor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .flavor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s;
    }

    .flavor-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .flavor-top {
      height: 195px;
      position: relative;
      overflow: hidden;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }

    .flavor-top img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: relative;
      z-index: 2;
    }

    .flavor-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px;
      color: #FFFDF9;
    }

    .flavor-fallback span {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .flavor-fallback b {
      font-family: Georgia, serif;
      font-size: 1.65rem;
      font-weight: 500;
    }

    .pastor .flavor-fallback { background: linear-gradient(155deg, #A9381E, #C96A2B); }
    .esquites .flavor-fallback { background: linear-gradient(155deg, #1E563B, #6A8B3D); }
    .costa .flavor-fallback { background: linear-gradient(155deg, #184258, #3D7A8C); }
    .hongos .flavor-fallback { background: linear-gradient(155deg, #6E472B, #A87C4F); }

    .flavor-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .flavor-body h3 {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, serif;
      font-weight: 600;
      font-size: 1.35rem;
    }

    .flavor-body p {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 8px 0 18px;
      flex: 1;
    }

    .flavor-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .flavor-foot small {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .empty-search {
      text-align: center;
      padding: 32px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--muted);
      margin-top: 16px;
    }

    /* Armador de caja y Punto de Venta */
    .builder {
      background: var(--surface-alt);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .builder-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .builder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 36px);
    }

    .builder-layout {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 32px;
      align-items: start;
    }

    .step-block {
      margin-bottom: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .step-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .field-label {
      display: block;
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--ink);
      margin: 0 0 8px;
    }

    .size
